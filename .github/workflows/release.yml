name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: write # Required to create a new tag
    steps:

# VALIDATE TAGS
    - id: validate-semver
      name: Validate tag against semantic versioning
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        SEMVER_PATTERN="^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
        if [[ ! $GITHUB_REF =~ $SEMVER_PATTERN ]]
          then
            echo "Tag $GITHUB_REF does not follow semantic versioning"
            exit 1
          fi

# SETUP BUILD ENVIRONMENT
    - id: prepare-maven-build
      name: Prepare Maven build
      uses: sualeh/prepare-maven-build@v1.8.2
      with:
        java-version: 21
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

# BUILD FOR DISTRIBUTION
    - id: build
      name: Build and test for distribution
      shell: bash
      run: |
        # Build
        mvn \
          --no-transfer-progress \
          --batch-mode \
          clean install

# CREATE GITHUB RELEASE
    - id: create-release
      name: Create GitHub release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          SchemaCrawler AI ${{ github.event.release.tag_name }} release at last commit ${{ github.sha }}
        generate_release_notes: true

# MOVE GITHUB TAG
    - id: install-gitsign
      name: Install gitsign for commit signing
      # See https://github.com/chainguard-dev/actions/blob/main/setup-gitsign/action.yml
      uses: chainguard-dev/actions/setup-gitsign@a9d4aa7202a63f8a6b8f81bb1570a0ca54460ac5
    - id: move-tag
      name: Move docker-mcp-registry tag
      env:
        GITSIGN_CONNECTOR_ID: "https://github.com/login/oauth"
        GITSIGN_TOKEN_PROVIDER: "github-actions"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: docker-mcp-registry
        SHA: ${{ github.sha }}
      shell: bash
      run: |
        # Move docker-mcp-registry tag
        set -euo pipefail
        ## Set username
        git config user.name "Sualeh Fatehi"
        git config user.email "sualeh@hotmail.com"
        ## Verify that gitsign is available
        gitsign --version
        ## Delete previous Docker Hub release and its tag
        gh release delete "$TAG" -y || true
        git push origin --delete "$TAG" || true
        git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && git tag -d "$TAG" || true
        ## Re-tag to last commit
        git tag -a "$TAG" -m "SchemaCrawler AI Release to Docker Hub"
        git push --follow-tags origin "$TAG"
        git show --no-patch "$TAG"
