name: Create Early Access Release

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: schemacrawler/schemacrawler-ai
  DOCKER_IMAGE_TAG: early-access-release
  DOCKERFILE_PATH: ./Dockerfile.early-access-release
  DOCKER_CONTEXT_PATH: ./

jobs:
  build:
    name: Create Early Access Release
    if: |
      github.actor != 'dependabot[bot]' &&
      ((github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: write # Required to create a new tag
    steps:

# SETUP BUILD ENVIRONMENT
    - id: prepare-maven-build
      name: Prepare Maven build
      uses: sualeh/prepare-maven-build@v1.8.2
      with:
        java-version: 21
        fetch-depth: 0

# BUILD DEPENDENCIES
    - id: build-schemacrawler-core
      name: Build SchemaCrawler-Core
      uses: sualeh/build-maven-dependency@v1.0.9
      with:
        repository: schemacrawler/SchemaCrawler-Core
        artifact: us.fatehi:schemacrawler:17.15.2
    - id: build-schemacrawler
      name: Build SchemaCrawler
      uses: sualeh/build-maven-dependency@v1.0.9
      with:
        repository: schemacrawler/SchemaCrawler
        artifact: us.fatehi:schemacrawler-commandline:17.15.2

# BUILD FOR DISTRIBUTION
    - id: build
      name: Build and test for distribution
      shell: bash
      run: |
        # Build
        # ... and install (for later phase of Docker image tests)
        mvn \
          --no-transfer-progress \
          --batch-mode \
          clean install
    - id: move-distrib
      name: Move SchemaCrawler AI distribution
      shell: bash
      run: |
        # Move SchemaCrawler AI distribution
        echo "NO NEED TO MOVE DISTRIBUTION"
        echo "The Early Access Release Docker Image build will pick it up from the target directory"

# MOVE GITHUB TAG
    - id: install-gitsign
      name: Install gitsign for commit signing
      # See https://github.com/chainguard-dev/actions/blob/main/setup-gitsign/action.yml
      uses: chainguard-dev/actions/setup-gitsign@a9d4aa7202a63f8a6b8f81bb1570a0ca54460ac5
    - id: move-tag
      name: Move early-access-release tag
      env:
        GITSIGN_CONNECTOR_ID: "https://github.com/login/oauth"
        GITSIGN_TOKEN_PROVIDER: "github-actions"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ env.DOCKER_IMAGE_TAG }}
        SHA: ${{ github.sha }}
      shell: bash
      run: |
        # Move early-access-release tag
        set -euo pipefail
        ## Set username
        git config user.name "Sualeh Fatehi"
        git config user.email "sualeh@hotmail.com"
        ## Verify that gitsign is available
        gitsign --version
        ## Delete previous early release and its tag
        gh release delete "$TAG" -y || true
        git push origin --delete "$TAG" || true
        git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && git tag -d "$TAG" || true
        ## Re-tag to last commit
        git tag -a "$TAG" -m "SchemaCrawler AI Early Access Release"
        git push origin "$TAG"


# BUILD AND PUBLISH DOCKER IMAGE
    - id: setup-qemu
      name: Setup QEMU
      uses: docker/setup-qemu-action@v4

    - id: setup-buildx
      name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - id: docker-login
      name: Log into Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - id: validate-build-configuration
      name: Validate build configuration
      uses: docker/build-push-action@v7
      with:
        call: check
        file: ${{ env.DOCKERFILE_PATH }}
        context: ${{ env.DOCKER_CONTEXT_PATH }}
        load: false
        push: false

    - id: meta
      name: Set up Docker metadata
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.DOCKER_IMAGE_TAG }},priority=1200
        labels: |
          maintainer=Sualeh Fatehi <sualeh@hotmail.com>
          org.opencontainers.image.authors=Sualeh Fatehi <sualeh@hotmail.com>
          org.opencontainers.image.vendor=SchemaCrawler
          org.opencontainers.image.licenses=(BUSL-1.1)
          org.opencontainers.image.url=https://www.schemacrawler.com/
          org.opencontainers.image.documentation=https://github.com/schemacrawler/SchemaCrawler-AI-MCP-Server-Usage

    - id: build-docker-image
      name: Build Docker image locally
      uses: docker/build-push-action@v7
      with:
        call: build
        file: ${{ env.DOCKERFILE_PATH }}
        context: ${{ env.DOCKER_CONTEXT_PATH }}
        # Build just for runner platform
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        load: true
        push: false

    - id: test-docker-image
      name: Test Docker image build
      shell: bash
      run: |
        # Run the Testcontainers integration test
        # This will pull the Docker image, start it, and verify the health endpoint
        mvn \
          --no-transfer-progress \
          --batch-mode \
          -Dverify \
          -Ddocker_image_tag=${{ env.DOCKER_IMAGE_TAG }} \
          -pl schemacrawler-ai-verify \
          test

    - id: push-docker-image
      name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        call: build
        file: ${{ env.DOCKERFILE_PATH }}
        context: ${{ env.DOCKER_CONTEXT_PATH }}
        platforms: |-
          linux/amd64
          linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        sbom: true
        provenance: true
        load: false
        push: true
